[project]
name = "deedpilot"
version = "2.0.0"
description = "Tax-deed auction intelligence and coaching — agentic AI on AWS"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  # --- Agentic core -------------------------------------------------------
  "strands-agents>=1.52.0",
  "strands-agents-tools>=0.8.6",
  "mcp>=1.9.0",
  # --- AWS ----------------------------------------------------------------
  "boto3>=1.40.0",
  "botocore>=1.40.0",
  # --- Web / API ----------------------------------------------------------
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1.3",
  "websockets>=13.0",
  # --- Data ---------------------------------------------------------------
  "sqlalchemy[asyncio]>=2.0.36",
  "greenlet>=3.1.1",
  "psycopg[binary,pool]>=3.2.3",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  # --- Observability ------------------------------------------------------
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "structlog>=24.4.0",
  # --- Ingestion / enrichment --------------------------------------------
  "httpx>=0.27.2",
  "selectolax>=0.3.21",
  "pypdf>=5.1.0",
  "tenacity>=9.0.0",
  # --- ML -----------------------------------------------------------------
  "numpy>=2.1.0",
  "scikit-learn>=1.5.2",
  # --- CLI ----------------------------------------------------------------
  "typer>=0.15.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "respx>=0.21.1",
]
infra = ["aws-cdk-lib>=2.170.0", "constructs>=10.4.2"]

[project.scripts]
deedpilot = "deedpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deedpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
