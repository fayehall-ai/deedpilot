[project]
name = "deedpilot-copilot"
version = "0.1.0"
description = "Self-improving tax-deed investment copilot — trusted tools, simulator, flywheel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deedpilot-copilot = "deedpilot_copilot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deedpilot_copilot*"]
